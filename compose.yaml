name: jingyue-ticket
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: jingyue_ticket_dev
      MYSQL_USER: jingyue
      MYSQL_PASSWORD: ${JINGYUE_MYSQL_PASSWORD:?请先生成.env}
      MYSQL_ROOT_PASSWORD: ${JINGYUE_MYSQL_ROOT_PASSWORD:?请先生成.env}
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:3318:3306"]
    volumes:
      - jy-mysql:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6398:6379"]
    volumes: ["jy-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["127.0.0.1:19092:19092"]
    volumes: ["jy-kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      start_period: 30s
      retries: 20
  topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "jingyue-ticket-orders-v1", "--partitions", "16", "--replication-factor", "1"]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      JINGYUE_BIND: 0.0.0.0
      JINGYUE_MYSQL_HOST: mysql
      JINGYUE_MYSQL_PORT: 3306
      JINGYUE_MYSQL_PASSWORD: ${JINGYUE_MYSQL_PASSWORD:?请先生成.env}
      JINGYUE_REDIS_HOST: redis
      JINGYUE_REDIS_PORT: 6379
      JINGYUE_KAFKA: kafka:9092
      JINGYUE_TICKET_SIGNING_KEY: ${JINGYUE_TICKET_SIGNING_KEY:?请先生成.env}
      JINGYUE_DEVELOPMENT: "true"
      JINGYUE_MOCK_PAYMENT: "true"
      JINGYUE_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:8089:8089"]
    volumes: ["jy-uploads:/app/uploads"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      JINGYUE_WEB_BIND: 0.0.0.0
      JINGYUE_BACKEND_HOST: backend
    ports: ["127.0.0.1:5190:5190"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  jy-mysql:
  jy-redis:
  jy-kafka:
  jy-uploads:
