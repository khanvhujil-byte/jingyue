# Opt-in: migrate db/blog_like_async.sql before starting this profile.
# Redis must use noeviction + durable storage. Single-node fsync=everysec is not zero-loss HA.
server:
  tomcat:
    threads:
      max: 320
      min-spare: 32
    max-connections: 12000
    accept-count: 12000
spring:
  resources:
    static-locations: ${HMDP_UI_DIRECTORY:file:./frontend/}
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  redis:

    lettuce:
      pool:
        max-active: 64
        max-idle: 32
        min-idle: 8
  task:
    scheduling:
      pool:
        size: 4
  kafka:
    producer:
      batch-size: 65536
      buffer-memory: 67108864
      properties:
        linger.ms: 5
        compression.type: lz4
        max.block.ms: 10000
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      fetch-min-size: 1
hmdp:
  web:
    embedded-ui-enabled: true
    max-keep-alive-requests: 10000
    keep-alive-timeout-ms: 60000
  like:
    async-enabled: true
    projector-delay-ms: 20
    projector-batch-size: 1000
    max-pending-events: 100000
    partition-rate-per-second: 8000
    user-rate-per-second: 20
  seckill:
    batch-enabled: true
    consumer-concurrency: 4
    batch-size: 500
    relay-batch-size: 1000
    relay-delay-ms: 10
    publish-timeout-seconds: 10
    max-pending-events: 100000
    global-limit-per-second: 10000
    user-limit-per-second: 20
logging:
  level:
    com.hmdp: info
    org.apache.kafka: warn
